[Info]
device = TOTOLink-EX200

[ResultDir]
root = result
lib_path = libs
ghidra = ghidra_res
iot_file = iot_file
elf_parse = elf_parse

[VulFunction]
buffer_overflow = memcpy, strcpy, sprintf, sscanf, strcat
command_injection = system, exec, popen, doSystemCmd
param = {"system": "1", "popen": "1"}

[Script]
check_unsafe_function = unsafe_func.py
aa = bb

[LLM]
api_key = os.environ["OPENAI_API_KEY"]
base_url = os.environ["BASE_URL"]
model = os.environ["MODEL"]
max_tokens = 4000
temperature = 0.6
top_p = 1
n = 1

[Session]
source_session = core/llm/source_session.json
sink_session = core/llm/sink_session.json
vul_session = core/llm/vul_session.json


[SourceFunction]
http_param = sub_28B84, GetValue

[IDAMCP]
ida_mcp_path = os.environ["YOUR_IDA_MCP_PATH"]
ida_dir = os.environ["YOUR_IDA_PATH"]
